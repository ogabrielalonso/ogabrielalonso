name: Refresh profile art

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths: ["data/local-activity.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render from live GitHub data plus local activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_profile.py
      - name: Commit when the art changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg assets/whoami.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile art"
          git pull --rebase
          git push
